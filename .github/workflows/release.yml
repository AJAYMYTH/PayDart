name: PayDart Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build_release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug
          # Attempt assembleRelease if signing configuration exists, otherwise fallback to assembleDebug
          ./gradlew assembleRelease || echo "Release build un-signed, debug APK will be published"

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

          # Copy debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/PayDart-${TAG}-debug.apk
          fi

          # Copy release APK if produced
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/PayDart-${TAG}-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/PayDart-${TAG}-release-unsigned.apk
          fi

          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PayDart ${{ env.TAG }}
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ⚡ PayDart ${{ env.TAG }} Release
            
            Lightweight, lightning-fast UPI QR Launcher for Android.

            ### What's Inside:
            - Instant QR detection (<10ms) powered by on-device Google ML Kit.
            - Zero-delay redirection into Google Pay, PhonePe, Paytm, BHIM, CRED, Navi, etc.
            - Precision Cyber HUD viewfinder with Electric Cyan targeting reticle.
            - Gallery/Screenshot QR upload via Android's zero-permission Photo Picker.
            - Strict zero-allocation on-device UPI URI parser.
            - 100% offline & fully private architecture.

            ### Installation:
            Download `PayDart-${{ env.TAG }}-debug.apk` below and install it directly on your Android device:
            ```bash
            adb install -r PayDart-${{ env.TAG }}-debug.apk
            ```
