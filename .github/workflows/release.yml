name: PayDart Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build_release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug
          # Attempt assembleRelease if signing configuration exists, otherwise fallback to assembleDebug
          ./gradlew assembleRelease || echo "Release build un-signed, debug APK will be published"

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

          # Copy debug APK with versioned and fixed names for direct downloads
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/PayDart-${TAG}-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/app-debug.apk
          fi

          # Copy release APK if produced
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/PayDart-${TAG}-release.apk
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/app-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/PayDart-${TAG}-release-unsigned.apk
          fi

          # Compute SHA-256 checksums
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PayDart ${{ env.TAG }} — Ultra-Fast UPI QR Launcher
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # ⚡ PayDart ${{ env.TAG }} — Production Release

            > **Ultra-Lightweight, Lightning-Fast Native UPI QR Launcher for Android (<10ms).**
            > 100% Offline • Zero Telemetry • Zero Ads • Under 5 MB

            ---

            ### 🚀 Highlights & Features

            - **⚡ <10ms QR Detection:** Pre-warmed native Google ML Kit C++ Barcode Engine (`libbarhopper_v3.so`) eliminates cold-start frame latency.
            - **🎯 Instant UPI Handoff:** Bypasses Android's slow system chooser bottom sheet with direct package intents and zero window transition latency (`overridePendingTransition(0, 0)`).
            - **🛡️ 100% Air-Gapped Privacy:** No `android.permission.INTERNET` requested. Operating system sandbox guarantees zero data or camera frames can leave your device.
            - **🖼️ Android Photo Picker:** Select and scan payment QR codes from screenshots and saved images with **zero storage permissions**.
            - **🎨 Electric Cyber HUD:** Clean, distraction-free Jetpack Compose viewfinder with tactile reticle and quick action dock.
            - **🔋 Zero Background Battery Drain:** Camera lifecycle cleanly detaches upon detection; zero persistent background services or notification receivers.

            ---

            ### 📲 Supported UPI Ecosystem

            Works out of the box with all standard NPCI UPI payment applications:
            - **Google Pay** (`com.google.android.apps.nbu.paisa.user`)
            - **PhonePe** (`com.phonepe.app`)
            - **Paytm** (`net.one97.paytm`)
            - **BHIM UPI** (`in.org.npci.upiapp`)
            - **CRED** (`com.dreamplug.androidapp`)
            - **Navi UPI** (`com.naviapp`)
            - **Amazon Pay** (`in.amazon.mShop.android.shopping`)
            - **Slice UPI** (`indwin.c3.shareme`)
            - *Any NPCI-compliant UPI app installed on the device*

            ---

            ### 📦 Direct Installation

            1. Download `PayDart-${{ env.TAG }}-debug.apk` or `app-debug.apk` from the Assets below.
            2. When prompted by Android, enable **Install unknown apps** for your browser or file manager.
            3. Grant Camera permission and launch checkout in milliseconds.

            #### Developer / ADB Quick Install:
            ```bash
            # Connect device with USB Debugging enabled
            adb install -r PayDart-${{ env.TAG }}-debug.apk
            ```

            ---

            ### 🔐 Cryptographic Integrity & Checksums

            Verify your downloaded APK with SHA-256 before sideloading:
            ```bash
            # Linux / macOS
            sha256sum PayDart-${{ env.TAG }}-debug.apk

            # Windows PowerShell
            Get-FileHash PayDart-${{ env.TAG }}-debug.apk -Algorithm SHA256
            ```
            Refer to the attached `SHA256SUMS.txt` for authoritative verification hashes.

            ---

            ### 🌐 Official Links
            - **Website & Online QR Scanner:** [https://ajaymyth.github.io/PayDart/](https://ajaymyth.github.io/PayDart/)
            - **Source Code & Documentation:** [https://github.com/AJAYMYTH/PayDart](https://github.com/AJAYMYTH/PayDart)
            - **License:** Apache 2.0 (Open Source)
