<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pd-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F076" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#040805" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#00F076" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Reticle Corners -->
  <path d="M12 20V12H20" stroke="#00F076" stroke-width="2.5" stroke-linecap="round" />
  <path d="M52 20V12H44" stroke="#00F076" stroke-width="2.5" stroke-linecap="round" />
  <path d="M12 44V52H20" stroke="#00F076" stroke-width="2.5" stroke-linecap="round" />
  <path d="M52 44V52H44" stroke="#00F076" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Central Lightning Dart in Neon Green & White -->
